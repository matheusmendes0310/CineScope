<header class="topbar">
  <a class="brand" href="#" aria-label="CineScope - início">
    <span class="brand-mark" aria-hidden="true"><i></i></span>
    <span>{{ title }}</span>
  </a>

  <div class="collection-stats" aria-label="Resumo da coleção">
    <div>
      <strong>{{ totalMovies }}</strong>
      <span>na coleção</span>
    </div>
    <div>
      <strong>{{ watchedMovies }}</strong>
      <span>assistidos</span>
    </div>
    <div>
      <strong>{{ averageRating }}</strong>
      <span>média geral</span>
    </div>
  </div>
</header>
